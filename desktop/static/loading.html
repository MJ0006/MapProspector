<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' file:">
<title>MapProspector</title>
<style>
  :root { --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --fg: #e2e8f0; --muted: #94a3b8; } }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px system-ui, "Segoe UI", sans-serif; }
  .box { text-align: center; }
  img { width: 72px; height: 72px; }
  .bar { width: 180px; height: 4px; margin: 18px auto 10px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 20%, transparent); overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
  <div class="box">
    <img src="icon.png" alt="">
    <div class="bar"></div>
    <p>Starting MapProspector…</p>
  </div>
</body>
</html>
