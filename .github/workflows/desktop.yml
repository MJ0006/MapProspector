# Builds the Windows installer (desktop/). Adapted from electron-starter-template's release.yml.
#
# Python can't be bundled for Windows from another OS, so this runs on a Windows runner:
# it bundles a full Python 3.13 (python.org's NuGet package) with requirements.txt, runs the
# test suite with that Python, packages the app, then starts the packaged app once to check it works.
#
# Get the installer: every green build of main replaces MapProspector-Setup.exe on the "latest" release
# (releases/latest/download/MapProspector-Setup.exe, linked from the README). Any run also has it under
# Artifacts → MapProspector-Setup. Pushing a tag like desktop-v1.0.0 makes a numbered release.

name: Windows app

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths: ['desktop/**', 'app/**', 'tests/**', 'vendor/**', 'requirements.txt', '.github/workflows/desktop.yml']

permissions:
  contents: read

env:
  PYTHON_VERSION: 3.13.5
  PYTHON_SHA256: fc496ae8aa3f7318704e24c4885c0cc0e3e6060c6e8af28aaa266226c01d96a1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write # only used to publish the installer: the latest release (main) and desktop-v* tags
    concurrency: # two pushes to main close together must not update the latest release at the same time
      group: desktop-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Bundle Python
        run: |
          $zip = "$env:RUNNER_TEMP\python.zip"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/python/$env:PYTHON_VERSION" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:PYTHON_SHA256) { throw "Python package checksum mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP\python"
          Move-Item "$env:RUNNER_TEMP\python\tools" desktop\build\python
          desktop\build\python\python.exe -m ensurepip
          desktop\build\python\python.exe -m pip install --no-warn-script-location --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Tests (with the bundled Python)
        run: desktop\build\python\python.exe -m pytest tests -q -p no:cacheprovider

      - name: Stage server files
        run: |
          $s = "desktop\build\server"
          robocopy app "$s\app" /E /XD __pycache__ /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          robocopy vendor\local-seo-brain "$s\vendor\local-seo-brain" /E /XD .git __pycache__ /XF .git /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          Copy-Item .env.example, .mcp.json, requirements.txt, README.md $s
          if (!(Test-Path "$s\vendor\local-seo-brain\scripts")) { throw "Local SEO Brain submodule is missing" }
          exit 0

      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned: Windows SmartScreen asks once before the first run
        run: |
          npm ci --no-audit --no-fund
          npm run dist:win

      - name: Start the packaged app once
        run: |
          $app = Start-Process desktop\dist\win-unpacked\MapProspector.exe -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep 2
            try {
              $r = Invoke-WebRequest http://127.0.0.1:8000/settings -UseBasicParsing
              if ($r.Content -match 'Settings' -and $r.Content -match [regex]::Escape("$env:APPDATA\MapProspector\.env")) { $ok = $true; break }
            } catch { }
          }
          # Kill only the app process, as a crash would: the server must then stop by itself (app/desktop_run.py).
          Stop-Process -Id $app.Id -Force
          $gone = $false
          foreach ($i in 1..30) {
            Start-Sleep 1
            try { Invoke-WebRequest http://127.0.0.1:8000/static/favicon.svg -UseBasicParsing -TimeoutSec 2 | Out-Null } catch { $gone = $true; break }
          }
          $log = "$env:APPDATA\MapProspector\logs\server.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if (!$ok) { throw "The packaged app did not serve MapProspector on port 8000" }
          if (!$gone) { throw "The server kept running after the app process was killed" }
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MapProspector-Setup
          path: desktop/dist/MapProspector-Setup-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item desktop\dist\MapProspector-Setup-*.exe).FullName --title "MapProspector $env:GITHUB_REF_NAME" --notes "Windows installer." -R $env:GITHUB_REPOSITORY

      - name: Publish as the latest release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fixed file name, so releases/latest/download/MapProspector-Setup.exe always gets the newest build.
          $repo = $env:GITHUB_REPOSITORY
          $file = "$env:RUNNER_TEMP\MapProspector-Setup.exe"
          Copy-Item (Get-Item desktop\dist\MapProspector-Setup-*.exe).FullName $file
          $when = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $notes = "Windows installer built from main ($($env:GITHUB_SHA.Substring(0, 7))) on $when UTC, after the tests and a start-up check passed.`n`nIt isn't code-signed: the first time, Windows SmartScreen asks; click More info, then Run anyway. Installing over an older version keeps your data in %APPDATA%\MapProspector."
          gh release view desktop-latest -R $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            # Move the tag to this commit, then swap the file in place (the download link never breaks).
            gh api -X PATCH "repos/$repo/git/refs/tags/desktop-latest" -f sha=$env:GITHUB_SHA -F force=true | Out-Null
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release upload desktop-latest $file --clobber -R $repo
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit desktop-latest --title "MapProspector for Windows (latest)" --notes $notes --latest -R $repo
          } else {
            gh release create desktop-latest $file --title "MapProspector for Windows (latest)" --notes $notes --latest --target $env:GITHUB_SHA -R $repo
          }
          exit $LASTEXITCODE
